name: Build and release Windows .exe

# Two ways to cut a release:
#  1. Push a version tag (e.g. v1.0.0) - ordinary commits to main never
#     trigger a build, so pushing work-in-progress doesn't spam releases.
#  2. Actions tab -> "Build and release Windows .exe" -> "Run workflow" -
#     no git tag needed, useful when you don't have a local git setup
#     with push access (e.g. pushing tags from a hosted/CI session).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.1)"
        required: true
        default: "v1.0.0"

# Needed to let the workflow create a GitHub Release and upload files to
# it - the default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: write

jobs:
  build:
    # Must be a real Windows runner - PyInstaller builds for whatever OS
    # it runs on, there's no cross-compiling a Windows .exe from Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Install UPX
        # Compresses the DLLs/exe PyInstaller collects (build_exe.py picks
        # it up automatically via UPX_DIR - see its UPX_EXCLUDE list for
        # the couple of files deliberately left uncompressed). Pinned to a
        # specific release rather than "latest" so this step doesn't start
        # silently pulling in an untested new UPX version.
        shell: bash
        run: |
          curl -fL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          7z x upx.zip
          echo "UPX_DIR=$PWD/upx-4.2.4-win64" >> "$GITHUB_ENV"

      - name: Build .exe
        run: python build_exe.py

      - name: Zip the build
        # --onedir produces a folder (exe + its Python/Qt runtime), not
        # a single portable .exe - zip it so there's still one file to
        # download and hand out, same as before the --onedir switch.
        shell: bash
        run: |
          cd dist
          7z a "TX Controller.zip" "TX Controller"

      - name: Compute SHA256 checksum
        # Published alongside the zip so anyone can verify the
        # download wasn't corrupted or tampered with after this
        # workflow built it - the build itself is unsigned (no code-
        # signing certificate), so this checksum plus "you can read
        # the build script yourself" is the honesty story in place of
        # a paid cert removing the SmartScreen warning outright.
        shell: bash
        run: |
          cd dist
          sha256sum "TX Controller.zip" > "TX Controller.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name is the tag itself (e.g.
          # v1.0.0). On a manual "Run workflow" dispatch there's no
          # tag yet, so fall back to the version typed into the
          # workflow_dispatch input - action-gh-release creates that
          # tag for us either way.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: |
            dist/TX Controller.zip
            dist/TX Controller.zip.sha256
          body: |
            **Windows SmartScreen note:** this build isn't code-signed
            (no paid certificate), so Windows will show an "Unknown
            Publisher" warning the first time you run it. That's
            expected, not a sign anything is wrong - click "More info"
            then "Run anyway". Verify the download against
            `TX Controller.zip.sha256` if you want to confirm it
            wasn't corrupted or altered, or build it yourself from
            source with `build_exe.py`.
